# PUBLIC APP configuration ("Reward Points", free, for App Store review).
#
# This is NOT the old production app (shopify.app.prod.toml, client_id 6e567e94…) and NOT the dev app
# (shopify.app.toml). Deploy it only with `shopify app deploy --config production`.
#
# Hosted on the shared domain under /reward-points-app (nginx strips that prefix, as for /reward-points-dev): PM2 app
# reward-points-app on port 3004 with APP_BASE_PATH=/reward-points-app. See docs/PUBLIC-APP.md.

client_id = "390831a870f228d74b15950a9b1f3043"
name = "Reward Points"
application_url = "https://integrations.platinuminfo.tech/reward-points-app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [
    "orders/paid",
    "orders/cancelled",
    "refunds/create",
    "app/uninstalled",
    "app/scopes_update"
  ]

  # Mandatory privacy topics: same route; the handlers live in web/privacy.js.
  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Only what the code uses: read_orders (order lookups), write_discounts (reward codes, GraphQL discount mutations),
# read_customers + write_customers (customer metafields the storefront blocks read).
# No product scopes: nothing reads or writes products.
scopes = "read_orders,write_discounts,read_customers,write_customers"

[auth]
redirect_urls = [
  "https://integrations.platinuminfo.tech/reward-points-app/api/auth",
  "https://integrations.platinuminfo.tech/reward-points-app/api/auth/callback"
]

[app_proxy]
url = "https://integrations.platinuminfo.tech/reward-points-app/api/proxy"
subpath = "reward-points"
prefix = "apps"
