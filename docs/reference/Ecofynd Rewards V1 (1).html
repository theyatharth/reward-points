/* ---------- demo side panel ---------- */
const PERSONAS = [
  ['priya', 'Priya Sharma', 'Available + pending points, one reward used'],
  ['kabir', 'Kabir Nair', 'Returned an order after using a reward'],
  ['ananya', 'Ananya Iyer', 'Has expired points, can redeem ₹50'],
  ['rahul', 'Rahul Mehta', 'New member, zero points'],
  ['', 'Guest', 'Not signed in; Meera has a guest order'],
];
function demoPanel() {
  const c = cust();
  const tips = {
    priya: ['Tap <b>Redeem</b> on ₹100 OFF, then <b>Use Reward</b> — it lands in the cart applied.', 'Move the store date <b>+30 days</b>: the queued refund for the returned clips retries first, then order #1007 activates on 20 Oct.', 'Open a product: the points line updates with quantity.'],
    kabir: ['Kabir returned the ₹2,329 stand after spending its points on ₹200 OFF. His balance is recovering 252 points.', 'Move the store date <b>+7 days</b>: order #1006 activates and repays what is owed first.', 'Try to redeem: rewards stay paused until the recovery clears.'],
    ananya: ['Her July 2025 points expired after 12 months. See the <b>Points expired</b> entry in Activity.', 'She has 636 points: enough for ₹50 OFF, 364 short of ₹100 OFF.', 'Add the ₹349 vase and open the cart: it offers ₹10 OFF, the best reward that fits a ₹349 order.'],
    rahul: ['Zero-balance state: no empty dashboard, just how to start.', 'Add something to the cart and place the order. The confirmation shows points on the way.'],
    '': ['Meera checked out as a guest on 22 Sep. Open <b>Rewards</b> and create her account to claim 634 held points.', 'The product page shows what a signed-in member would earn.'],
  }[ui.cid || ''];
  const recent = c ? E.s.txns.filter(t => t.customerId === c.id).slice(-6).reverse() : [];
  const ev = E.s.analytics.slice(0, 6);
  return `<aside class="side" aria-label="Demo controls">
    <div class="panel"><h3>View the store as</h3><div class="persona">${PERSONAS.map(([id, n, d]) => `<button data-act="persona" data-v="${id}" aria-pressed="${(ui.cid || '') === id}"><b>${n}</b><span>${d}</span></button>`).join('')}</div></div>
    <div class="panel"><h3>Try this</h3><ul class="try">${tips.map(t => `<li><span>${t}</span></li>`).join('')}</ul></div>
    ${c ? `<div class="panel"><div class="row-between"><h3>Ledger for ${esc(c.name.split(' ')[0])}</h3><button class="link" data-act="admincust" data-v="${c.id}" style="font-size:13px">Open in admin</button></div>
      <div class="mini">${recent.map(t => `<div><span class="mono faint">${t.id}</span><span>${esc(t.description)}</span><span class="pill st-${t.status}">${t.type === 'activation' ? '' : t.points > 0 ? '+' : ''}${P(t.points)}</span></div>`).join('') || '<p class="muted">No entries yet.</p>'}</div></div>` : ''}
    <div class="panel"><h3>Analytics events</h3><div class="mini">${ev.map(e => `<div><span class="mono faint">${DT(e.t).split(',')[1] || ''}</span><span class="mono">${e.name}</span><span class="faint" style="font-size:11.5px">${esc(Object.values(e.props).slice(0, 2).join(' · '))}</span></div>`).join('')}</div></div>
  </aside>`;
}

/* =====================================================================
   ADMIN CONSOLE
   ===================================================================== */
const ATABS = [['overview', 'Overview'], ['customers', 'Customers'], ['orders', 'Orders & webhooks'], ['rules', 'Earning & redemption'], ['rewards', 'Reward catalogue'], ['recon', 'Reconciliation'], ['notify', 'Notifications'], ['audit', 'Audit log'], ['analytics', 'Analytics events']];
function adminView() {
  const fails = E.s.failed.length;
  const body = { overview: aOverview, customers: aCustomers, orders: aOrders, rules: aRules, rewards: aRewards, recon: aRecon, notify: aNotify, audit: aAudit, analytics: aAnalytics }[ui.a.tab]();
  return `<div class="admin"><nav class="anav" aria-label="Admin">${ATABS.map(([k, l]) => `<button data-act="atab" data-v="${k}" ${ui.a.tab === k ? 'aria-current="page"' : ''}>${l}${k === 'orders' && fails ? `<span class="cnt">${fails}</span>` : ''}</button>`).join('')}</nav><div class="amain">${body}</div></div>`;
}
const kpi = (k, v, s) => `<div class="kpi"><span class="k">${k}</span><span class="v num">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`;
const pct = x => (x * 100).toFixed(1) + '%';

function aOverview() {
  const s = E.stats();
  const seg = [['Pending', s.pending, 'var(--s1)'], ['Available', s.available, 'var(--s2)'], ['Redeemed', s.redeemed, 'var(--s3)'], ['Expired', s.expired, 'var(--s4)'], ['Reversed', s.reversed, 'var(--s5)']];
  const tot = seg.reduce((a, x) => a + x[1], 0) || 1;
  return `<div><h2>Rewards overview</h2><p class="lede">All figures are computed from the ledger in this prototype's sample data (${Object.keys(E.s.orders).length} orders, store date ${D(E.now, true)}).</p></div>
  <div class="kgroup"><span class="eyebrow">Members</span><div class="kpis">${kpi('Total members', P(s.members))}${kpi('Active (90 days)', P(s.active))}${kpi('New (30 days)', P(s.newM))}${kpi('Returning buyers', P(s.returning), `of ${P(s.buyers)} buyers`)}</div></div>
  <div class="kgroup"><span class="eyebrow">Points</span><div class="kpis">${kpi('Issued', P(s.issued), INR(E.valueOf(s.issued)))}${kpi('Pending', P(s.pending), INR(E.valueOf(s.pending)))}${kpi('Available', P(s.available), INR(E.valueOf(s.available)))}${kpi('Redeemed', P(s.redeemed), INR(E.valueOf(s.redeemed)))}${kpi('Expired', P(s.expired), INR(E.valueOf(s.expired)))}${kpi('Reversed', P(s.reversed), INR(E.valueOf(s.reversed)))}</div>
    <div class="card" style="display:grid;gap:10px"><b style="font-family:var(--f-head)">Where issued points are now</b>
      <div class="stack" role="img" aria-label="${seg.map(x => `${x[0]} ${P(x[1])}`).join(', ')}">${seg.filter(x => x[1] > 0).map(x => `<i style="width:${x[1] / tot * 100}%;background:${x[2]}" title="${x[0]}: ${P(x[1])} pts"></i>`).join('')}</div>
      <div class="legend">${seg.map(x => `<span><i style="background:${x[2]}"></i>${x[0]} <b class="num" style="color:var(--ink)">${P(x[1])}</b></span>`).join('')}</div></div></div>
  <div class="kgroup"><span class="eyebrow">Outstanding reward value (liability)</span>
    <div class="tbl-wrap"><table><thead><tr><th>Bucket</th><th class="r">Points</th><th class="r">₹ value</th><th>How to read it</th></tr></thead><tbody>
      <tr><td><b>Available</b></td><td class="r num">${P(s.available)}</td><td class="r num"><b>${INR(E.valueOf(s.available))}</b></td><td>Customers can redeem this today. This is the live liability.</td></tr>
      <tr><td><b>Unlocked, not used</b></td><td class="r num">${P(s.openRewards)} codes</td><td class="r num"><b>${INR(s.openRewardValue)}</b></td><td>Discount codes issued and still valid.</td></tr>
      <tr><td>Pending</td><td class="r num">${P(s.pending)}</td><td class="r num">${INR(E.valueOf(s.pending))}</td><td>Contingent. Becomes liability only after the holding period, net of returns.</td></tr>
      <tr><td>Redeemed</td><td class="r num">${P(s.redeemed)}</td><td class="r num">${INR(E.valueOf(s.redeemed))}</td><td>Already converted to discounts (${INR(s.usedValue)} used on orders).</td></tr>
      <tr><td>Expired</td><td class="r num">${P(s.expired)}</td><td class="r num">${INR(E.valueOf(s.expired))}</td><td>No longer valid. Not a liability.</td></tr>
      <tr><td>Being recovered</td><td class="r num">${P(s.owed)}</td><td class="r num">${INR(E.valueOf(s.owed))}</td><td>Points reversed after they were spent; recovered from future earnings.</td></tr>
    </tbody></table></div></div>
  <div class="kgroup"><span class="eyebrow">Rewards</span><div class="kpis">${kpi('Rewards unlocked', P(s.unlocked))}${kpi('Rewards used', P(s.rewardsUsed), INR(s.usedValue) + ' discount')}${kpi('Open codes', P(s.openRewards))}${kpi('Points redemption rate', pct(s.redemptionRate), 'redeemed ÷ activated')}</div></div>
  <div class="kgroup"><span class="eyebrow">Business (members only, to date)</span><div class="kpis">${kpi('Member revenue', INR(Math.round(s.revenue)))}${kpi('AOV', INR(Math.round(s.aov)))}${kpi('Repeat purchase rate', pct(s.repeatRate))}${kpi('Orders per buyer', s.frequency.toFixed(2))}${kpi('Revenue per buyer', INR(Math.round(s.clv)), 'CLV to date')}</div>
    <p class="faint" style="font-size:12.5px">These describe members only. Proving that loyalty causes repeat purchases needs a comparison against non-member or holdout cohorts over the same period (BRD §58–59).</p></div>`;
}

function aCustomers() {
  const q = ui.a.q.toLowerCase();
  const list = Object.values(E.s.customers).filter(c => !q || [c.name, c.email, c.phone].join(' ').toLowerCase().includes(q));
  const c = E.s.customers[ui.a.cid] || list[0];
  return `<div><h2>Customers</h2><p class="lede">Search a member to see balances, the full ledger and why each change happened. Support never needs database access.</p></div>
  <div class="split"><div style="display:grid;gap:10px"><label class="sr" for="csearch">Search customers</label><input class="inp" id="csearch" data-input="csearch" placeholder="Name, email or phone" value="${esc(ui.a.q)}">
    <div class="cust-list">${list.map(x => { const b = E.balances(x.id); return `<button data-act="acust" data-v="${x.id}" aria-pressed="${c && x.id === c.id}"><span><b style="font-family:var(--f-head)">${esc(x.name)}</b><br><span class="faint" style="font-size:12px">${esc(x.email)}</span></span><span class="num" style="font-weight:800">${P(b.available)}</span></button>`; }).join('') || '<p class="muted">No match.</p>'}</div></div>
    <div style="display:grid;gap:16px;min-width:0">${c ? custDetail(c) : ''}</div></div>`;
}
function custDetail(c) {
  const b = E.balances(c.id), a = b.acct;
  const tx = E.s.txns.filter(t => t.customerId === c.id).slice().reverse();
  const orders = Object.values(E.s.orders).filter(o => o.customerId === c.id);
  const reds = E.s.redemptions.filter(r => r.customerId === c.id);
  const adj = ui.a.adj;
  return `<div class="card" style="display:grid;gap:12px"><div class="row-between" style="flex-wrap:wrap"><div><h3 style="font-family:var(--f-display);font-weight:600;font-size:24px">${esc(c.name)}</h3><p class="muted" style="font-size:13.5px">${esc(c.email)} · ${esc(c.phone)} · <span class="mono">${esc(a.id)}</span> · member since ${D(a.createdAt, true)}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="adjopen" data-v="add">Add Points</button><button class="btn ghost small" data-act="adjopen" data-v="deduct">Deduct Points</button><button class="btn soft small" data-act="scrollledger">View Ledger</button></div></div>
    <div class="kpis">${kpi('Available', P(b.available), INR(b.availableValue))}${kpi('Pending', P(b.pending), INR(b.pendingValue))}${kpi('Lifetime earned', P(a.lifetimeEarned), 'net of returns')}${kpi('Lifetime redeemed', P(a.lifetimeRedeemed))}${b.debt ? kpi('Being recovered', P(b.debt), 'from a return') : ''}</div>
    ${adj ? `<form class="fs" data-form="adjust" style="background:var(--surface)"><h3>${adj.kind === 'add' ? 'Add points' : 'Deduct points'}</h3>
      <div class="form-grid"><label class="f" for="adj-amt">Points<input class="inp num" id="adj-amt" name="amt" type="number" min="1" step="1" required value="${esc(adj.amt || '')}"></label>
      <label class="f" for="adj-reason">Reason<select class="inp" id="adj-reason" name="reason" required><option value="">Choose…</option>${(adj.kind === 'add' ? ['Customer service goodwill', 'Special bonus', 'Order issue correction', 'Missing points'] : ['Order issue correction', 'Duplicate points', 'Points recovery', 'Policy abuse']).map(r => `<option ${adj.reason === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
      <label class="f" for="adj-admin">Admin<input class="inp" id="adj-admin" name="admin" value="${ADMIN}" required></label></div>
      <label class="f" for="adj-note">Internal note (not shown to the customer)<textarea class="inp" id="adj-note" name="note" placeholder="e.g. Ticket #4821 — planter arrived chipped">${esc(adj.note || '')}</textarea></label>
      ${adj.error ? `<div class="err">${esc(adj.error)}</div>` : ''}<div style="display:flex;gap:8px"><button class="btn small" type="submit">${adj.kind === 'add' ? 'Add points' : 'Deduct points'}</button><button class="btn ghost small" type="button" data-act="adjclose">Cancel</button></div></form>` : ''}
    ${ui.a.msg ? `<div class="ok">${esc(ui.a.msg)}</div>` : ''}</div>
  <div style="display:grid;gap:8px" id="ledger"><b style="font-family:var(--f-head);font-size:16px">Ledger (${tx.length} transactions)</b>
    <div class="tbl-wrap"><table><thead><tr><th>Transaction</th><th>Created</th><th>Activity</th><th class="r">Points</th><th>Status</th><th>Order</th><th>Source</th><th>Available / expires</th><th>Ref</th><th>Why (support view)</th></tr></thead><tbody>
    ${tx.map(t => { const o = t.orderId ? E.s.orders[t.orderId] : null; const pend = t.pendingDelta ? `pending ${t.pendingDelta > 0 ? '+' : ''}${P(t.pendingDelta)}` : ''; const av = t.availableDelta ? `available ${t.availableDelta > 0 ? '+' : ''}${P(t.availableDelta)}` : '';
      return `<tr><td class="mono">${t.id}</td><td class="num" style="white-space:nowrap">${DT(t.createdAt)}</td><td>${t.type}</td><td class="r num"><b class="${t.points > 0 && t.type !== 'activation' ? 'plus' : t.points < 0 ? 'minus' : ''}">${t.points > 0 && t.type !== 'activation' ? '+' : ''}${P(t.points)}</b><br><span class="faint" style="font-size:11px">${[pend, av].filter(Boolean).join(' · ')}</span></td><td><span class="pill st-${t.status}">${t.status}</span></td><td>${o ? esc(o.name) : '—'}</td><td class="mono">${esc(t.source)}</td><td class="num" style="white-space:nowrap">${t.availableAt ? 'avail. ' + D(t.availableAt) : ''}${t.expiresAt ? 'exp. ' + D(t.expiresAt, true) : ''}${!t.availableAt && !t.expiresAt ? '—' : ''}</td><td class="mono">${t.ref || '—'}</td><td style="min-width:240px">${esc(t.description)}${t.meta.note ? `<br><span class="faint">Note: ${esc(t.meta.note)} · by ${esc(t.meta.admin)}</span>` : ''}${t.meta.owed ? `<br><span class="minus">${P(t.meta.owed)} could not be covered → recovered from future earnings</span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div>
  <div class="form-grid" style="align-items:start">
    <div style="display:grid;gap:8px"><b style="font-family:var(--f-head)">Orders</b><div class="tbl-wrap"><table><thead><tr><th>Order</th><th class="r">Eligible</th><th class="r">Points</th><th class="r">Reversed</th><th>State</th></tr></thead><tbody>${orders.map(o => `<tr><td>${esc(o.name)}<br><span class="faint">${D(o.createdAt, true)}</span></td><td class="r num">${INR(o.eligible)}</td><td class="r num">${P(o.points)}</td><td class="r num">${P(o.reversed)}</td><td>${esc(o.status)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No orders</td></tr>'}</tbody></table></div></div>
    <div style="display:grid;gap:8px"><b style="font-family:var(--f-head)">Rewards &amp; redemptions</b><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Reward</th><th>Status</th><th>Shopify ref</th></tr></thead><tbody>${reds.map(r => `<tr><td class="mono">${r.code}</td><td>${esc(r.name)} · ${P(r.pointsUsed)} pts</td><td><span class="pill st-${r.status}">${r.status}</span>${r.orderId ? '<br><span class="faint">on ' + esc(E.s.orders[r.orderId].name) + '</span>' : ''}</td><td class="mono faint">${r.shopifyRef.split('/').pop()}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">None</td></tr>'}</tbody></table></div></div>
  </div>`;
}

function aOrders() {
  const orders = Object.values(E.s.orders).sort((a, b) => b.createdAt - a.createdAt);
  const act = ui.a.orderAct;
  return `<div><h2>Orders &amp; webhooks</h2><p class="lede">Simulate what Shopify sends: returns, partial refunds, cancellations, duplicate deliveries and failures. Every event is idempotent and logged.</p></div>
  ${E.s.failed.length ? `<div class="card" style="display:grid;gap:10px;border-color:var(--danger)"><b style="font-family:var(--f-head);color:var(--danger)">Failed events awaiting retry (${E.s.failed.length})</b>
    ${E.s.failed.map(f => `<div class="row-between" style="flex-wrap:wrap;font-size:13.5px"><span><span class="mono">${f.id}</span> · ${f.topic} · ${esc((E.s.orders[f.payload.orderId] || {}).name || f.payload.name || '')} ${f.payload.amount ? '· ' + INR(f.payload.amount) : ''}<br><span class="faint">${esc(f.error)} · attempt ${f.attempts} · auto-retry ${DT(f.nextRetryAt)}</span></span><button class="btn small" data-act="retry" data-v="${f.id}">Retry now</button></div>`).join('')}</div>` : ''}
  <div class="card row-between" style="flex-wrap:wrap"><span style="font-size:14px"><b style="font-family:var(--f-head)">Failure simulator</b><br><span class="muted">Make the next webhook fail so you can watch the retry queue and reconciliation catch it.</span></span>
    <button class="btn ${E.s.failNext ? '' : 'ghost'} small" data-act="failnext">${E.s.failNext ? 'Next webhook will fail ✓' : 'Fail the next webhook'}</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th class="r">Paid</th><th class="r">Eligible</th><th class="r">Points</th><th>Points state</th><th>Order status</th><th>Actions</th></tr></thead><tbody>
  ${orders.map(o => { const c = o.customerId ? E.s.customers[o.customerId] : null; const state = o.guest ? 'Held for guest' : o.pendingLeft ? `${P(o.pendingLeft)} pending → ${D(o.availableAt)}` : o.activated ? `${P(o.activated)} activated` : o.points ? 'Cancelled' : '—';
    return `<tr><td><b>${esc(o.name)}</b><br><span class="faint">${D(o.createdAt, true)}</span></td><td>${c ? esc(c.name) : `<span class="faint">Guest · ${esc(o.email)}</span>`}</td><td class="r num">${INR(o.total)}${o.rewardCode ? '<br><span class="faint">reward used</span>' : ''}</td><td class="r num">${INR(o.eligible)}</td><td class="r num">${P(o.points)}${o.reversed ? `<br><span class="minus">−${P(o.reversed)}</span>` : ''}</td><td>${state}</td><td>${esc(o.status)}</td>
    <td style="white-space:nowrap">${o.status === 'cancelled' || o.status === 'returned' || o.status === 'refunded' ? '<span class="faint">closed</span>' : `<button class="link" data-act="oact" data-v="${o.id}" data-k="return">Return</button> · <button class="link" data-act="oact" data-v="${o.id}" data-k="refund">Refund</button> · <button class="link" data-act="ocancel" data-v="${o.id}">Cancel</button> · <button class="link" data-act="odup" data-v="${o.id}">Resend webhook</button>`}</td></tr>
    ${act && act.id === o.id ? `<tr><td colspan="8" style="background:var(--surface)"><form data-form="refund" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><label class="f" for="rf-amt">${act.kind === 'return' ? 'Returned item value (₹, incl. GST)' : 'Refunded item value (₹, incl. GST)'}<input class="inp num" id="rf-amt" name="amt" type="number" min="1" step="1" max="${Math.round(o.eligibleMerchRemaining ?? E.merchValue(o))}" value="${Math.round(o.lines[o.lines.length - 1].price)}" required></label>
      <span class="faint" style="font-size:12.5px;max-width:320px">Up to ${INR(o.eligibleMerchRemaining ?? E.merchValue(o))} of eligible items remain. Points reverse in proportion; the final refund lands exactly on what was earned.</span><button class="btn small" type="submit">Send refunds/create</button><button class="btn ghost small" type="button" data-act="oactclose">Cancel</button></form></td></tr>` : ''}`; }).join('')}
  </tbody></table></div>
  <div style="display:grid;gap:8px"><b style="font-family:var(--f-head);font-size:16px">Webhook event log</b><div class="tbl-wrap"><table><thead><tr><th>Received</th><th>Event ID</th><th>Topic</th><th>Order</th><th>Result</th><th>Detail</th></tr></thead><tbody>
    ${E.s.eventLog.slice(0, 40).map(e => `<tr><td class="num" style="white-space:nowrap">${DT(e.t)}</td><td class="mono">${esc(String(e.id).slice(0, 26))}</td><td class="mono">${e.topic}</td><td>${esc(e.ref || '')}</td><td><span class="pill ${e.result === 'processed' ? 'st-Available' : e.result === 'failed' ? 'st-Reversed' : 'st-Expired'}">${e.result}</span></td><td>${esc(e.note)}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function aRules() {
  const c = E.cfg, m = ui.a.ruleMsg;
  return `<div><h2>Earning &amp; redemption rules</h2><p class="lede">Rules are configuration, not code. Every saved change is validated and written to the audit log with its previous value.</p></div>
  <form data-form="rules" style="display:grid;gap:16px">
  <div class="fs"><h3>Purchase earning</h3>
    <div class="form-grid"><label class="f" for="r-spend">Spend (₹)<input class="inp num" id="r-spend" name="spend" type="number" step="1" value="${c.earn.spend}" data-input="rulepreview"></label>
    <label class="f" for="r-pts">Earn (points)<input class="inp num" id="r-pts" name="points" type="number" step="1" value="${c.earn.points}" data-input="rulepreview"></label>
    <label class="f" for="r-round">Rounding<select class="inp" id="r-round" name="rounding" data-input="rulepreview"><option value="floor" ${c.earn.rounding === 'floor' ? 'selected' : ''}>Proportional, round down</option><option value="round" ${c.earn.rounding === 'round' ? 'selected' : ''}>Proportional, nearest</option><option value="block" ${c.earn.rounding === 'block' ? 'selected' : ''}>Per full spend block only</option></select></label>

function rulePreview(spend, points, rounding) {
  const t = new Engine(); t.s.config.earn = { ...E.cfg.earn, spend: +spend, points: +points, rounding };

  const eff = (E.cfg.redeem.value / E.cfg.redeem.points) * (+points / +spend) * 100;

}

function notesView() {

    ['PDP earning message', 'Storefront → Shop → product'], ['Cart reward experience', 'Storefront → Cart'], ['Post-purchase message', 'Storefront → Place order'],
    ['Customer account', 'Storefront → Account'], ['Manual adjustments + audit', 'Admin → Customers'], ['Dashboard & liability', 'Admin → Overview'], ['Reconciliation', 'Admin → Reconciliation'], ['Analytics events', 'Admin → Analytics events'], ['Notifications (sparse defaults)', 'Admin → Notifications'],
  ];
  return `<div class="notes"><div><h2 style="font-family:var(--f-display);font-weight:600;font-size:28px">Build notes for the dev team</h2><p class="lede" style="color:var(--ink-2);margin-top:4px">This page is a working model of the V1 target. The engine code on this page is the reference logic for the production service.</p></div>
  <div class="card"><h3>Recommended architecture (custom ledger, Shopify-native surfaces)</h3><ul>
    <li><b>Loyalty service</b> (small Shopify app backend + Postgres) owns the ledger, point lots, redemptions, events and audit tables exactly as modelled here. The ledger is the only source of truth; a cached balance is written to a customer metafield for fast storefront reads.</li>
    <li><b>Webhooks</b>: <span class="mono">orders/create</span> (or <span class="mono">orders/paid</span> for COD policy), <span class="mono">refunds/create</span>, <span class="mono">orders/cancelled</span>, <span class="mono">customers/create</span> (claims guest holds by email). Store <span class="mono">X-Shopify-Webhook-Id</span> as the idempotency key and keep order ID uniqueness on purchase entries.</li>
    <li><b>Redemption</b> creates a single-use, customer-specific discount via <span class="mono">discountCodeBasicCreate</span> with the reward's minimum subtotal and collection rules. "Use Reward" applies it through <span class="mono">/discount/CODE</span> or the cart AJAX API, so no copy-paste.</li>
    <li><b>Storefront</b>: a theme app extension with app blocks for PDP and cart, and an app embed for the widget, loaded lazily after first interaction. The PDP estimate is computed from rule values in a shop metafield, so it needs no API call.</li>
    <li><b>Account</b>: a Customer Account UI extension for the Rewards page on new customer accounts; an app proxy page for classic accounts.</li>
    <li><b>Jobs</b>: an hourly job runs the same <span class="mono">processDue()</span> steps: activate, expire, expire codes, retry failed events. A nightly job runs reconciliation and alerts on issues.</li></ul></div>
  <div class="card"><h3>Decisions to confirm before build</h3><ul>
    <li><b>GST in the earning base.</b> The BRD default excludes taxes, and prices on ecofynd.com include GST, so a ₹419 pot earns 399 points, not 419. If "₹100 = 100 points" should read literally to customers, tick "Include GST" in the rules.</li>
    <li><b>Reward rate.</b> The baseline rules (₹100 → 100 points, 100 points → ₹10) return 10% of spend. Rewards at ₹200 OFF need ₹2,000+ of spend. Check this against margin before launch.</li>
    <li><b>Returns after points are spent.</b> This build cancels unused codes first, then recovers the remainder from future points and pauses redemption meanwhile. It never deducts money or silently zeroes a balance.</li>
    <li><b>Orders paid with a reward</b> earn on the amount after the reward discount. A fully refunded or cancelled order returns the reward's points.</li>
    <li><b>COD orders.</b> For cash on delivery, start the holding period on delivery (fulfilment webhook) rather than order creation.</li></ul></div>
  <div class="card"><h3>What this build covers</h3><div class="cov">${cov.map(([a, b]) => `<div style="font-size:13.5px"><b>${a}</b><br><span class="muted">${b}</span></div>`).join('')}</div></div>
  <div class="card"><h3>Future-ready, not built (per BRD §68)</h3><ul><li>Review, photo and video rewards, referrals, birthday and signup bonuses slot in as new ledger transaction types with their own idempotency keys (e.g. one per review ID).</li><li>Campaign multipliers already run through the rule engine (switched off). Tiers can reuse the same rule-evaluation step as an earning multiplier.</li></ul></div>

}

  qty: d => { ui.qty = Math.max(1, Math.min(10, ui.qty + +d.v)); },
  add: () => { const c = cartOf(); const l = c.lines.find(x => x.productId === ui.pid); if (l) l.qty += ui.qty; else c.lines.push({ productId: ui.pid, qty: ui.qty }); toast(`Added to cart · ${PMAP[ui.pid].title}`); },
  cqty: d => { const c = cartOf(); const l = c.lines[+d.i]; l.qty += +d.v; if (l.qty <= 0) c.lines.splice(+d.i, 1); ui.cartConfirm = null; },
  widget: () => { ui.widget = !ui.widget; if (ui.widget) E.track('loyalty_widget_opened'); },
  redeem: d => { ui.sheet = { kind: 'redeem', rewardId: d.v, key: reqKey() }; E.track('reward_viewed', { reward: d.v }); },
  closesheet: () => { ui.sheet = null; },
  doredeem: d => {
    const r = E.redeem(ui.cid, d.v, ui.sheet.key); // same key on double-tap → one debit
    if (!r.ok) { ui.sheet.error = r.error; return; }
    ui.sheet = { kind: 'done', redId: r.redemption.id };
  },
  use: d => { const c = cartOf(); c.rewardCode = d.v; ui.sheet = null; E.track('reward_applied', { code: d.v }); const v = c.lines.length ? E.validateRewardForCart(ui.cid, d.v, cartLines(), c.coupon) : { ok: true }; if (!v.ok) { c.rewardCode = null; toast(v.error); } go('cart'); return false; },
  apply: d => { const c = cartOf(); const v = E.validateRewardForCart(ui.cid, d.v, cartLines(), c.coupon); if (v.ok) { c.rewardCode = d.v; E.track('cart_reward_applied', { code: d.v }); } else toast(v.error); },
  unapply: () => { cartOf().rewardCode = null; },
  cartconfirm: d => { ui.cartConfirm = d.v; ui.cartKey = reqKey(); },
  cartcancel: () => { ui.cartConfirm = null; },
  cartredeem: d => { const r = E.redeem(ui.cid, d.v, ui.cartKey); if (!r.ok) { toast(r.error); ui.cartConfirm = null; return; } cartOf().rewardCode = r.redemption.code; ui.cartConfirm = null; E.track('cart_reward_applied', { code: r.redemption.code }); toast(`${r.redemption.name} unlocked and applied`); },
  checkout: () => {
    const c = cartOf(); const r = E.checkout({ customerId: ui.cid || null, email: ui.cid ? null : ui.signup.email, lines: cartLines(), couponCode: c.coupon, rewardCode: c.rewardCode });
    if (!r.ok) { toast(r.error); return; }
    ui.carts[ui.cid || 'guest'] = { lines: [], coupon: null, rewardCode: null };
    ui.lastOrder = r.orderId;
    if (r.webhook === 'failed') toast('Order placed. The loyalty webhook failed and is queued for retry. See Admin → Orders.');
    go('done'); return false;
  },
  copy: (d) => { navigator.clipboard && navigator.clipboard.writeText(d.v).then(() => toast('Code copied'), () => toast('Select the code to copy it')); return false; },
  persona: d => { ui.cid = d.v || null; ui.sheet = null; ui.widget = false; ui.cartConfirm = null; if (ui.screen === 'done') ui.screen = 'rewards'; ui.scrollTop = true; },
  admincust: d => { ui.mode = 'admin'; ui.a.tab = 'customers'; ui.a.cid = d.v; ui.a.adj = null; ui.a.msg = null; },
  adv: d => { const out = E.advance(+d.v); ui.a.recon = null; toast(`Store date moved ${d.v} day${d.v > 1 ? 's' : ''}${out.length ? ': ' + out.slice(0, 3).join(' · ') + (out.length > 3 ? ` · +${out.length - 3} more` : '') : '. Nothing due.'}`); },
  reset: () => { E = seedEngine(); ui.carts = {}; ui.sheet = null; ui.lastOrder = null; ui.a.recon = null; ui.a.adj = null; ui.a.msg = null; ui.tests = null; if (ui.screen === 'done') ui.screen = 'rewards'; toast('Demo data reset to 30 Sep 2026'); },
  atab: d => { ui.a.tab = d.v; ui.a.msg = null; ui.a.ruleMsg = null; ui.a.rwMsg = null; },
  acust: d => { ui.a.cid = d.v; ui.a.adj = null; ui.a.msg = null; },
  adjopen: d => { ui.a.adj = { kind: d.v }; ui.a.msg = null; },
  adjclose: () => { ui.a.adj = null; },
  scrollledger: () => { const el = document.getElementById('ledger'); if (el) el.scrollIntoView({ behavior: 'smooth' }); return false; },
  oact: d => { ui.a.orderAct = { id: d.v, kind: d.k }; },
  oactclose: () => { ui.a.orderAct = null; },
  ocancel: d => { const r = E.ingest({ id: 'evt_cx_' + reqKey(), topic: 'orders/cancelled', payload: { orderId: d.v } }); toast(r.status === 'processed' ? r.note : 'Webhook ' + r.status); },
  odup: d => { const o = E.s.orders[d.v]; const evt = E.s.eventLog.slice().reverse().find(e => e.topic === 'orders/create' && e.ref === o.name && e.result === 'processed'); const r = E.ingest({ id: evt ? evt.id : 'evt_x', topic: 'orders/create', payload: { orderId: o.id, name: o.name, customerId: o.customerId, email: o.email, lines: o.lines, discount: o.discount, shipping: o.shipping, total: o.total } }); toast(`Duplicate delivery of ${o.name}: ${r.status}. No points added.`); },
  retry: d => { const r = E.retryEvent(d.v); ui.a.recon = null; toast('Retry ' + r.status + (r.note ? ': ' + r.note : '')); },
  failnext: () => { E.s.failNext = E.s.failNext ? 0 : 1; },
  recon: () => { ui.a.recon = E.reconcile(); toast(ui.a.recon.issues.length ? `${ui.a.recon.issues.length} issue(s) found` : 'Reconciliation clean'); },
  drift: () => { E.acctOf('priya').available += 250; ui.a.recon = E.reconcile(); toast('Added 250 to Priya\'s cached balance without a ledger entry'); },
  rebuild: () => { E.rebuildCache(ADMIN); ui.a.recon = E.reconcile(); toast('Cached balances rebuilt from the ledger'); },
  redit: d => { ui.a.rewardEdit = JSON.parse(JSON.stringify(E.s.rewards.find(r => r.id === d.v))); ui.a.rwMsg = null; },
  rnew: () => { ui.a.rewardEdit = { id: 'rw' + Date.now().toString(36), name: 'Free shipping', type: 'fixed_discount', points: 300, value: 79, minCart: 299, maxUses: 1, eligibleCollections: [], excludedCollections: ['gift-cards'], expiryDays: 30, stackable: true, couponCompatible: true, eligibility: 'all', status: 'paused' }; ui.a.rwMsg = null; },
  rclose: () => { ui.a.rewardEdit = null; ui.a.rwMsg = null; },
  ntoggle: (d, el) => { E.cfg.notifications[d.v][d.k] = el.checked; E.audit(ADMIN, 'notification_changed:' + d.v + '.' + d.k, String(!el.checked), String(el.checked), 'Notification settings'); return 'keep'; },
  runtests: () => { ui.tests = null; },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('scrim') && ev.target.closest('.sheet')) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  const r = fn(el.dataset, el, ev);
  if (r === 'keep') return;
  if (r !== false) render();
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.input === 'csearch') { ui.a.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('csearch'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.dataset.input === 'rulepreview') { const f = el.form; document.getElementById('rule-preview').innerHTML = rulePreview(f.spend.value, f.points.value, f.rounding.value); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault(); const f = ev.target; const kind = f.dataset.form; const fd = new FormData(f);
  if (kind === 'coupon') { const c = cartOf(); if (c.coupon) c.coupon = null; else { const v = String(fd.get('coupon') || '').trim().toUpperCase(); if (COUPONS[v]) { c.coupon = v; if (c.rewardCode) { const ok = E.validateRewardForCart(ui.cid, c.rewardCode, cartLines(), v); if (!ok.ok) { c.rewardCode = null; toast(ok.error); } } } else toast('That coupon code isn\'t valid. Try GARDEN10.'); } }
  if (kind === 'signup') { const r = E.createCustomer({ name: String(fd.get('name')).trim(), email: String(fd.get('email')).trim(), phone: '' }); ui.cid = r.customer.id; ui.signup.email = r.customer.email; toast(r.duplicate ? 'Welcome back — this email already has an account' : `Account created · ${P(r.account.pending)} points claimed`); ui.screen = 'rewards'; }
  if (kind === 'adjust') {
    const adj = ui.a.adj; const amt = Math.round(+fd.get('amt')); const delta = adj.kind === 'add' ? amt : -amt;
    Object.assign(adj, { amt: fd.get('amt'), reason: fd.get('reason'), note: fd.get('note') });
    const r = E.adjust(ui.a.cid, delta, String(fd.get('reason')), String(fd.get('note')), String(fd.get('admin')).trim());
    if (!r.ok) adj.error = r.error; else { ui.a.adj = null; ui.a.msg = `${delta > 0 ? 'Added' : 'Deducted'} ${P(Math.abs(delta))} points. Ledger entry ${r.txn.id} and audit record created.`; }
  }
  if (kind === 'refund') {
    const act = ui.a.orderAct; const r = E.ingest({ id: 'evt_rf_' + reqKey(), topic: 'refunds/create', payload: { orderId: act.id, refundId: 'rf_' + reqKey(), amount: +fd.get('amt'), kind: act.kind } });
    ui.a.orderAct = null; ui.a.recon = null; toast(r.status === 'processed' ? r.note : 'Webhook ' + r.status + (r.status === 'failed' ? ' — queued for retry' : ''));
  }
  if (kind === 'rules') {
    const n = JSON.parse(JSON.stringify(E.cfg));
    n.earn.spend = +fd.get('spend'); n.earn.points = +fd.get('points'); n.earn.rounding = fd.get('rounding'); n.earn.basis = fd.get('basis');
    n.earn.includeTax = !!fd.get('includeTax'); n.earn.includeShipping = !!fd.get('includeShipping'); n.earn.excludeGiftCards = !!fd.get('excludeGiftCards');
    n.earn.excludedCollections = Object.keys(COLLECTIONS).filter(k => fd.get('exc_' + k));
    n.redeem.points = +fd.get('rpoints'); n.redeem.value = +fd.get('rvalue');
    n.holdingDays = fd.get('holding') === 'custom' ? +fd.get('holdingCustom') : +fd.get('holding');
    n.expiryMonths = +fd.get('expiry'); n.shortfallPolicy = fd.get('shortfall');
    n.returnPointsOnCodeExpiry = !!fd.get('returnOnExpiry'); n.restoreRewardOnFullRefund = !!fd.get('restore');
    n.campaign.name = String(fd.get('cname')); n.campaign.multiplier = +fd.get('cmult'); n.campaign.maxBonus = +fd.get('cmax'); n.campaign.enabled = !!fd.get('cenabled');
    if (n.campaign.enabled && !E.cfg.campaign.enabled) { n.campaign.start = E.now; n.campaign.end = E.now + Math.max(1, +fd.get('cdays')) * DAY; }
    const r = E.updateConfig(n, ADMIN, String(fd.get('reason') || ''));
    ui.a.ruleMsg = r.ok ? { ok: true, text: `Saved ${r.changed.length} change${r.changed.length > 1 ? 's' : ''}: ${r.changed.join(', ')}. New orders use the new rules; existing ledger entries keep the rule they were earned under.` } : { ok: false, errors: r.errors };
  }
  if (kind === 'reward') {
    const ed = ui.a.rewardEdit;
    const r = { ...ed, name: String(fd.get('name')).trim(), points: +fd.get('points'), value: +fd.get('value'), minCart: +fd.get('minCart'), maxUses: +fd.get('maxUses'), expiryDays: +fd.get('expiryDays'), eligibility: fd.get('eligibility'), status: fd.get('status'),
      eligibleCollections: Object.keys(COLLECTIONS).filter(k => fd.get('inc_' + k)), excludedCollections: Object.keys(COLLECTIONS).filter(k => fd.get('exc_' + k)), stackable: !!fd.get('stackable'), couponCompatible: !!fd.get('couponCompatible') };
    ui.a.rewardEdit = r; const res = E.saveReward(r, ADMIN, 'Catalogue edit');
    ui.a.rwMsg = res.ok ? { ok: true, warn: res.warn } : { ok: false, errors: res.errors };
  }
  render();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (ui.sheet || ui.widget)) { ui.sheet = null; ui.widget = false; render(); } });
E.track('loyalty_widget_viewed'); E.track('loyalty_page_viewed');
render();

</script>

</body></html>
