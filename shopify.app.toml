# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8f0594c80b6d94776d96b472d9a8cecc"
name = "Reward Points"
application_url = "https://rewards.platinuminfo.tech"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app/uninstalled", "orders/paid", "refunds/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_customers, read_customers, write_products, read_discounts, write_discounts, read_orders"

[auth]
redirect_urls = [ "https://rewards.platinuminfo.tech/api/auth" ]

[app_proxy]
url = "https://rewards.platinuminfo.tech/api/proxy"
subpath = "rewards"
prefix = "apps"
