# Development app configuration.
# This file is the DEFAULT Shopify CLI config — `shopify app dev` and a bare
# `shopify app deploy` use it.  Production deploys require --config prod.
#
# client_id: set this to the development Partner app's client_id once you
# create it in the Partner Dashboard.  The production client_id (6e567e94…)
# lives in shopify.app.prod.toml only.

client_id = "0f07160caeafdddae72336eb51421e05"
name = "Reward Points (Dev)"
application_url = "https://integrations.platinuminfo.tech/reward-points-dev"

embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app/uninstalled", "orders/paid", "refunds/create", "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
scopes = "write_customers, read_customers, write_products, read_discounts, write_discounts, read_orders"

[auth]
redirect_urls = [
  "https://integrations.platinuminfo.tech/reward-points-dev/api/auth",
  "https://integrations.platinuminfo.tech/reward-points-dev/api/auth/callback"
]

[app_proxy]
url = "https://integrations.platinuminfo.tech/reward-points-dev/api/proxy"
subpath = "rewards-dev"
prefix = "apps"
